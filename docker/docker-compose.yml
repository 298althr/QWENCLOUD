# ALTHR Autopilot — Docker Compose (dev)
# Brings up PostgreSQL (pgvector) + Redis for local development.
# Backend & frontend run via `npm run dev` on the host during build phase.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: althr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: althr
      POSTGRES_PASSWORD: althr
      POSTGRES_DB: althr_autopilot
    ports:
      - "5432:5432"
    volumes:
      - althr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U althr -d althr_autopilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: althr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - althr_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  althr_pgdata:
  althr_redisdata:
