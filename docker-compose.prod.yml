# ALTHR Autopilot — Production Docker Compose for Alibaba Cloud ECS
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml:
#   - NEXT_PUBLIC_API_BASE is env-driven (set PUBLIC_URL in .env)
#   - No Docker socket mount (not needed on ECS)
#   - Resource limits for free-tier ECS (1C1G / 2C2G) using mem_limit/cpus (enforced by plain Compose, not just Swarm)
#   - Restart policy: always

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: althr-postgres
    restart: always
    environment:
      POSTGRES_USER: althr
      POSTGRES_PASSWORD: althr
      POSTGRES_DB: althr_autopilot
    ports:
      - "5432:5432"
    volumes:
      - althr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U althr -d althr_autopilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    container_name: althr-redis
    restart: always
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - althr_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

  backend:
    build: ./backend
    container_name: althr-backend
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://althr:althr@postgres:5432/althr_autopilot
      - REDIS_URL=redis://redis:6379
      - QWEN_BASE_URL=https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      - NODE_ENV=production
      - CORS_ORIGIN=http://47.84.106.210:3001,http://47.84.106.210,http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - althr_files:/var/althr-volumes
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prebuilt
    container_name: althr-frontend
    restart: always
    environment:
      - PORT=3001
      - HOSTNAME=0.0.0.0
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m

volumes:
  althr_pgdata:
  althr_redisdata:
  althr_files:
