<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a857"/>
      <stop offset="100%" stop-color="#b8941f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <text x="600" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#d4a857">ALTHR Autopilot - System Architecture</text>
  <text x="600" y="55" text-anchor="middle" font-size="13" fill="#737373">Track 4: Autopilot Agent | Global AI Hackathon with Qwen Cloud</text>

  <!-- User Interfaces -->
  <rect x="50" y="80" width="250" height="120" rx="10" fill="#1a1a2e" stroke="#d4a857" stroke-width="1.5"/>
  <text x="175" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#d4a857">User Interfaces</text>
  <rect x="70" y="120" width="210" height="30" rx="6" fill="#262626" stroke="#404040"/>
  <text x="175" y="140" text-anchor="middle" font-size="12" fill="#e5e5e5">Web Dashboard (Next.js)</text>
  <rect x="70" y="158" width="210" height="30" rx="6" fill="#262626" stroke="#404040"/>
  <text x="175" y="178" text-anchor="middle" font-size="12" fill="#e5e5e5">Telegram Bot Notifications</text>

  <!-- API Gateway -->
  <rect x="370" y="80" width="200" height="120" rx="10" fill="#1a1a2e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="470" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#3b82f6">API Gateway</text>
  <rect x="390" y="120" width="160" height="30" rx="6" fill="#262626" stroke="#404040"/>
  <text x="470" y="140" text-anchor="middle" font-size="12" fill="#e5e5e5">Express.js + Socket.io</text>
  <rect x="390" y="158" width="160" height="30" rx="6" fill="#262626" stroke="#404040"/>
  <text x="470" y="178" text-anchor="middle" font-size="12" fill="#e5e5e5">API Key Auth Middleware</text>

  <!-- Intelligence Layer -->
  <rect x="650" y="80" width="280" height="200" rx="10" fill="#1a1a2e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="790" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#22c55e">Intelligence Layer (Qwen Cloud)</text>
  <rect x="670" y="120" width="120" height="28" rx="6" fill="#262626" stroke="#404040"/>
  <text x="730" y="139" text-anchor="middle" font-size="11" fill="#e5e5e5">Qwen API Client</text>
  <rect x="800" y="120" width="120" height="28" rx="6" fill="#262626" stroke="#404040"/>
  <text x="860" y="139" text-anchor="middle" font-size="11" fill="#e5e5e5">Guardrails</text>
  <rect x="670" y="156" width="120" height="28" rx="6" fill="#262626" stroke="#404040"/>
  <text x="730" y="175" text-anchor="middle" font-size="11" fill="#e5e5e5">Token Tracker</text>
  <rect x="800" y="156" width="120" height="28" rx="6" fill="#262626" stroke="#404040"/>
  <text x="860" y="175" text-anchor="middle" font-size="11" fill="#e5e5e5">Kill Switch</text>
  <rect x="670" y="192" width="120" height="28" rx="6" fill="#262626" stroke="#404040"/>
  <text x="730" y="211" text-anchor="middle" font-size="11" fill="#e5e5e5">Tool Executor</text>
  <rect x="800" y="192" width="120" height="28" rx="6" fill="#262626" stroke="#404040"/>
  <text x="860" y="211" text-anchor="middle" font-size="11" fill="#e5e5e5">MCP Server</text>
  <rect x="670" y="228" width="240" height="28" rx="6" fill="#262626" stroke="#404040"/>
  <text x="790" y="247" text-anchor="middle" font-size="11" fill="#e5e5e5">DashScope API (Qwen Turbo / Plus / Max)</text>

  <!-- Decision Pipeline -->
  <rect x="970" y="80" width="200" height="200" rx="10" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1070" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#f59e0b">Decision Pipeline</text>
  <rect x="990" y="120" width="160" height="24" rx="6" fill="#262626" stroke="#404040"/>
  <text x="1070" y="137" text-anchor="middle" font-size="11" fill="#e5e5e5">DRE (Research)</text>
  <rect x="990" y="150" width="160" height="24" rx="6" fill="#262626" stroke="#404040"/>
  <text x="1070" y="167" text-anchor="middle" font-size="11" fill="#e5e5e5">DREV (Verification)</text>
  <rect x="990" y="180" width="160" height="24" rx="6" fill="#262626" stroke="#404040"/>
  <text x="1070" y="197" text-anchor="middle" font-size="11" fill="#e5e5e5">CRDS (Cascade Score)</text>
  <rect x="990" y="210" width="160" height="24" rx="6" fill="#262626" stroke="#404040"/>
  <text x="1070" y="227" text-anchor="middle" font-size="11" fill="#e5e5e5">Certainty Pipeline</text>
  <rect x="990" y="240" width="160" height="24" rx="6" fill="#262626" stroke="#404040"/>
  <text x="1070" y="257" text-anchor="middle" font-size="11" fill="#e5e5e5">DQS (Quality Score)</text>

  <!-- Security Layer -->
  <rect x="370" y="230" width="200" height="160" rx="10" fill="#1a1a2e" stroke="#ef4444" stroke-width="1.5"/>
  <text x="470" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#ef4444">7-Layer SAF</text>
  <text x="470" y="275" text-anchor="middle" font-size="10" fill="#a3a3a3">L1 Asset Classification</text>
  <text x="470" y="290" text-anchor="middle" font-size="10" fill="#a3a3a3">L2 Identity and Authority</text>
  <text x="470" y="305" text-anchor="middle" font-size="10" fill="#a3a3a3">L3 Network Segmentation</text>
  <text x="470" y="320" text-anchor="middle" font-size="10" fill="#a3a3a3">L4 Policy Enforcement</text>
  <text x="470" y="335" text-anchor="middle" font-size="10" fill="#a3a3a3">L5 Immutable Logging</text>
  <text x="470" y="350" text-anchor="middle" font-size="10" fill="#a3a3a3">L6 Containment</text>
  <text x="470" y="365" text-anchor="middle" font-size="10" fill="#a3a3a3">L7 Governance (HITL)</text>

  <!-- Monitoring -->
  <rect x="50" y="230" width="250" height="160" rx="10" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="175" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#8b5cf6">Monitoring Engine</text>
  <text x="175" y="278" text-anchor="middle" font-size="11" fill="#a3a3a3">CPU | RAM | Disk</text>
  <text x="175" y="295" text-anchor="middle" font-size="11" fill="#a3a3a3">Network BW | Latency</text>
  <text x="175" y="312" text-anchor="middle" font-size="11" fill="#a3a3a3">Processes | Ports</text>
  <text x="175" y="329" text-anchor="middle" font-size="11" fill="#a3a3a3">OS Info | Uptime</text>
  <text x="175" y="346" text-anchor="middle" font-size="11" fill="#a3a3a3">Docker Container Health</text>
  <text x="175" y="363" text-anchor="middle" font-size="11" fill="#a3a3a3">Cascade Effect Analysis</text>

  <!-- Deployment Engine -->
  <rect x="50" y="420" width="250" height="160" rx="10" fill="#1a1a2e" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="175" y="445" text-anchor="middle" font-size="14" font-weight="bold" fill="#06b6d4">Deployment Engine</text>
  <text x="175" y="468" text-anchor="middle" font-size="11" fill="#a3a3a3">GitHub Clone + Stack Detection</text>
  <text x="175" y="485" text-anchor="middle" font-size="11" fill="#a3a3a3">Node | Python | Go | PHP | Static</text>
  <text x="175" y="502" text-anchor="middle" font-size="11" fill="#a3a3a3">Auto Dockerfile Generation</text>
  <text x="175" y="519" text-anchor="middle" font-size="11" fill="#a3a3a3">Docker Build + Run + Health Check</text>
  <text x="175" y="536" text-anchor="middle" font-size="11" fill="#a3a3a3">Webhook Auto-Rebuild</text>
  <text x="175" y="553" text-anchor="middle" font-size="11" fill="#a3a3a3">AI Failure Investigation</text>
  <text x="175" y="570" text-anchor="middle" font-size="11" fill="#a3a3a3">AI File Fixing + Rebuild</text>

  <!-- Memory -->
  <rect x="370" y="420" width="200" height="160" rx="10" fill="#1a1a2e" stroke="#ec4899" stroke-width="1.5"/>
  <text x="470" y="445" text-anchor="middle" font-size="14" font-weight="bold" fill="#ec4899">Persistent Memory</text>
  <text x="470" y="468" text-anchor="middle" font-size="10" fill="#a3a3a3">M1 Raw Events</text>
  <text x="470" y="483" text-anchor="middle" font-size="10" fill="#a3a3a3">M2 Observations</text>
  <text x="470" y="498" text-anchor="middle" font-size="10" fill="#a3a3a3">M3 SOPs (Learning)</text>
  <text x="470" y="513" text-anchor="middle" font-size="10" fill="#a3a3a3">M4 User Preferences</text>
  <text x="470" y="528" text-anchor="middle" font-size="10" fill="#a3a3a3">M5 Patterns</text>
  <text x="470" y="543" text-anchor="middle" font-size="10" fill="#a3a3a3">M6 Error Memory</text>
  <text x="470" y="558" text-anchor="middle" font-size="10" fill="#a3a3a3">M7 Context Window</text>

  <!-- Data Layer -->
  <rect x="650" y="420" width="280" height="160" rx="10" fill="#1a1a2e" stroke="#22c55e" stroke-width="1.5"/>
  <text x="790" y="445" text-anchor="middle" font-size="14" font-weight="bold" fill="#22c55e">Data Layer (Alibaba Cloud ECS)</text>
  <rect x="670" y="460" width="120" height="50" rx="6" fill="#262626" stroke="#404040"/>
  <text x="730" y="480" text-anchor="middle" font-size="11" fill="#e5e5e5">PostgreSQL</text>
  <text x="730" y="497" text-anchor="middle" font-size="9" fill="#737373">pgvector + audit</text>
  <rect x="800" y="460" width="120" height="50" rx="6" fill="#262626" stroke="#404040"/>
  <text x="860" y="480" text-anchor="middle" font-size="11" fill="#e5e5e5">Redis</text>
  <text x="860" y="497" text-anchor="middle" font-size="9" fill="#737373">cache + queues</text>
  <rect x="670" y="520" width="240" height="40" rx="6" fill="#262626" stroke="#404040"/>
  <text x="790" y="538" text-anchor="middle" font-size="11" fill="#e5e5e5">Docker Engine (Container Management)</text>
  <text x="790" y="553" text-anchor="middle" font-size="9" fill="#737373">althr-postgres | althr-redis | althr-backend | althr-frontend</text>

  <!-- Compliance -->
  <rect x="970" y="420" width="200" height="160" rx="10" fill="#1a1a2e" stroke="#d4a857" stroke-width="1.5"/>
  <text x="1070" y="445" text-anchor="middle" font-size="14" font-weight="bold" fill="#d4a857">Compliance</text>
  <text x="1070" y="468" text-anchor="middle" font-size="10" fill="#a3a3a3">Audit Trail (Immutable)</text>
  <text x="1070" y="483" text-anchor="middle" font-size="10" fill="#a3a3a3">Command Whitelist</text>
  <text x="1070" y="498" text-anchor="middle" font-size="10" fill="#a3a3a3">Human-in-the-Loop</text>
  <text x="1070" y="513" text-anchor="middle" font-size="10" fill="#a3a3a3">Secret Management</text>
  <text x="1070" y="528" text-anchor="middle" font-size="10" fill="#a3a3a3">Data Residency</text>
  <text x="1070" y="543" text-anchor="middle" font-size="10" fill="#a3a3a3">Incident Response</text>
  <text x="1070" y="558" text-anchor="middle" font-size="10" fill="#a3a3a3">Access Control (API Key)</text>

  <!-- Connection arrows -->
  <line x1="300" y1="140" x2="370" y2="140" stroke="#404040" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="140" x2="650" y2="140" stroke="#404040" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="140" x2="970" y2="140" stroke="#404040" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="200" x2="470" y2="230" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="310" x2="370" y2="310" stroke="#404040" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="175" y1="390" x2="175" y2="420" stroke="#404040" stroke-width="2"/>
  <line x1="300" y1="500" x2="370" y2="500" stroke="#404040" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="500" x2="650" y2="500" stroke="#404040" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="500" x2="970" y2="500" stroke="#404040" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#404040"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="600" y="630" text-anchor="middle" font-size="12" fill="#737373">Alibaba Cloud ECS (47.84.106.210) | Docker Compose | 4 Containers</text>
