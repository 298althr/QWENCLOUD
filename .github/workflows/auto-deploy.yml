name: Auto-Deploy to ECS

on:
  push:
    branches: [track4]

jobs:
  # ---- Backend: SSH into ECS, git pull, rebuild backend container ----
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            cd /opt/althr-autopilot
            git pull origin track4
            docker compose -f docker-compose.prod.yml build --no-cache backend
            docker compose -f docker-compose.prod.yml up -d backend
            echo "Backend deployed at $(date)"

  # ---- Frontend: Build in CI (enough RAM), scp artifacts, rebuild on ECS ----
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build Next.js (production)
        env:
          NEXT_PUBLIC_API_BASE: ${{ secrets.NEXT_PUBLIC_API_BASE }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: cd frontend && npm run build

      - name: Package build artifacts
        run: |
          tar -cf frontend-deploy.tar -C frontend .next/standalone .next/static public

      - name: Upload artifacts to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          source: frontend-deploy.tar
          target: /tmp/

      - name: Rebuild frontend container on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            cd /opt/althr-autopilot/frontend
            rm -rf .next/standalone .next/static
            tar -xf /tmp/frontend-deploy.tar
            rm -f /tmp/frontend-deploy.tar
            docker compose -f /opt/althr-autopilot/docker-compose.prod.yml build --no-cache frontend
            docker compose -f /opt/althr-autopilot/docker-compose.prod.yml up -d frontend
            echo "Frontend deployed at $(date)"
